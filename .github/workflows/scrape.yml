name: Download and Upload Alafasy Zip (Raw Git Storage)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: copilot/add-dynamic-verse-selection
          lfs: false
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git for Large Pushes
        run: |
          git config --global http.postBuffer 524288000
          git config --global filter.lfs.smudge ""
          git config --global filter.lfs.clean ""
          echo "Git buffer increased for large file push"

      - name: Create work branch
        id: create_branch
        run: |
          BRANCH="raw-audio/zip-${GITHUB_RUN_ID}"
          echo "Created branch name: $BRANCH"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          git checkout -b "$BRANCH"

      - name: Cleanup existing audio folder
        run: |
          set -e
          if [ -d docs/audio/Alafasy ]; then
            echo "Removing existing audio directory..."
            git rm -r --ignore-unmatch docs/audio/Alafasy
            git commit -m "Remove existing audio directory" || echo "No changes"
          else
            mkdir -p docs/audio/Alafasy
          fi

      - name: Clean gitattributes
        run: |
          set -e
          if [ -f .gitattributes ]; then
            echo "Cleaning .gitattributes..."
            grep -v '\*\.mp3' .gitattributes > .gitattributes.clean || true
            mv .gitattributes.clean .gitattributes
            grep -v '\*\.zip' .gitattributes > .gitattributes.clean2 || true
            mv .gitattributes.clean2 .gitattributes
            
            git add .gitattributes
            git commit -m "Remove audio extensions from .gitattributes" || echo "No changes"
          else
            echo "No .gitattributes found"
          fi
          git push --set-upstream origin ${{ env.BRANCH }}

      - name: Download zip
        run: |
          echo "Downloading Alafasy audio zip..."
          curl -fL --retry 3 -o 000_versebyverse.zip "https://everyayah.com/data/Alafasy_128kbps/000_versebyverse.zip"
          if [ ! -f 000_versebyverse.zip ]; then
            echo "Download failed!"
            exit 1
          fi
          ls -lh 000_versebyverse.zip

      - name: Move zip to audio folder
        run: |
          echo "Moving zip to docs/audio/Alafasy..."
          mkdir -p docs/audio/Alafasy
          mv 000_versebyverse.zip docs/audio/Alafasy/
          ls -lh docs/audio/Alafasy/

      - name: Add and commit zip file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Adding zip file..."
          git add -f docs/audio/Alafasy/000_versebyverse.zip
          
          echo "Verifying staged files..."
          git status --short
          
          if git diff --cached --quiet; then
            echo "ERROR: No files staged!"
            exit 1
          fi
          
          git commit -m "Add Alafasy audio zip (Raw Git storage)"
          
          echo "Pushing to branch ${{ env.BRANCH }}..."
          for i in 1 2 3; do
            if git push origin HEAD; then
              echo "Push succeeded"
              break
            else
              echo "Push attempt $i failed, retrying in 10s..."
              sleep 10
            fi
          done

      - name: Verify Remote File
        run: |
          echo "Verifying zip exists on remote..."
          git fetch origin ${{ env.BRANCH }}
          REMOTE_FILE=$(git ls-tree -r --name-only origin/${{ env.BRANCH }} docs/audio/Alafasy | grep "000_versebyverse.zip" || true)
          if [ -z "$REMOTE_FILE" ]; then
            echo "CRITICAL: Zip file not found on remote!"
            exit 1
          else
            echo "Remote file found: $REMOTE_FILE"
          fi

      - name: Create Pull Request
        uses: actions/github-script@v6
        env:
          BRANCH: ${{ env.BRANCH }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = 'copilot/add-dynamic-verse-selection';
            const head = process.env.BRANCH;

            const title = `Add Alafasy Audio Zip (Raw Storage) - ${head}`;
            const body = [
              "## 📦 Audio Import (Zip Archive)",
              "",
              "This PR adds the Alafasy 128kbps audio archive.",
              "",
              "### Details",
              `- **Target Branch:** \`${base}\``,
              `- **File:** \`docs/audio/Alafasy/000_versebyverse.zip\``,
              `- **Storage Type:** Raw Git Blob (No LFS)`,
              "",
              "### ⚠️ Important",
              "- File is stored directly in Git history.",
              "- Application must extract zip at runtime/build.",
              "",
              "### Checklist",
              "- [ ] Verify app can extract and play audio",
              "- [ ] Confirm repo size is acceptable"
            ].join("\n");

            try {
              const pr = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head,
                base,
                body,
                maintainer_can_modify: true
              });
              core.setOutput('pr_url', pr.data.html_url);
              console.log("PR created:", pr.data.html_url);
            } catch (error) {
              if (error.message && error.message.includes('A pull request already exists')) {
                console.log("PR already exists.");
              } else {
                core.setFailed(error.message);
              }
            }
